  <style>
    :root{--ink:#18363a;--muted:#6d7e7e;--line:#d9e2dc;--paper:#fbfcf9;--green:#799779;--green-dark:#4e715d;--green-soft:#e7efe8;--gold:#d8a02a;--gold-soft:#fbf3df;--red:#d15448;--red-soft:#fae9e7;--shadow:0 24px 60px rgba(30,57,48,.11)}
    *{box-sizing:border-box} body{margin:0;color:var(--ink);background:radial-gradient(circle at 50% 7%,#fff 0,#fbfcf9 35%,#f0f5ef 100%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45} button,input{font:inherit} button{cursor:pointer;border:0}.app{max-width:1180px;margin:auto;padding:26px 28px 64px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:22px}.brand{display:flex;align-items:center;gap:13px}.shield{width:42px;height:48px;position:relative;display:grid;place-items:center;border:3px solid var(--green-dark);border-radius:22px 22px 26px 26px;color:var(--green-dark);font-size:22px;font-weight:800;transform:scaleX(.85)}.shield:after{content:"✓";position:absolute;inset:7px 0 0;text-align:center}.brand-name{font-size:22px;font-weight:800;letter-spacing:-.04em}.brand-name span{color:var(--green-dark)}.brand-note{display:block;font-size:12px;color:var(--muted);margin-top:1px}.top-actions{display:flex;gap:24px;color:#607070;font-size:14px}.top-actions button{background:none;color:inherit;padding:8px}.hero{text-align:center;margin:70px auto 34px}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--green-dark);font-weight:800}.hero h1{font-size:clamp(36px,5vw,64px);line-height:1.03;letter-spacing:-.06em;margin:13px 0 14px}.hero p{margin:0 auto;color:#657474;font-size:18px;max-width:590px}.hub{position:relative;max-width:800px;min-height:480px;margin:28px auto 28px}.hub-lines{position:absolute;inset:44px 82px 42px;z-index:0}.hub-lines i{position:absolute;display:block;height:1px;width:200px;background:#b4c8b3;transform-origin:0 0}.hub-lines i:nth-child(1){left:28%;top:20%;transform:rotate(160deg)}.hub-lines i:nth-child(2){left:72%;top:20%;transform:rotate(20deg)}.hub-lines i:nth-child(3){left:28%;top:69%;transform:rotate(200deg)}.hub-lines i:nth-child(4){left:72%;top:69%;transform:rotate(-20deg)}.hub-lines i:nth-child(5){left:50%;top:100%;height:92px;transform:rotate(-90d 50;font-size:14px;margin:22px 0 8px}.input-wrap{display:flex;gap:10px;align-items:center;border:1px solid #cbd8cc;border-radius:13px;padding:0 14px;background:#fff}.input-wrap span{color:var(--green-dark);font-size:20px}.input-wrap input{flex:1;border:0;outline:0;background:none;padding:14px 0;color:var(--ink)}.upload{margin-top:14px;border:1.5px dashed #b7cabb;border-radius:16px;padding:17px;text-align:center;background:#f7faf6;color:#687b72}.upload strong{color:var(--green-dark);display:block}.upload small{display:block;margin-top:3px}.upload.selected{border-style:solid;background:var(--green-soft)}.panel-actions{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:20px}.primary{background:var(--green-dark);color:#fff;padding:13px 19px;border-radius:12px;font-weight:800;box-shadow:0 8px 20px rgba(79,114,93,.18)}.primary:hover{background:#3f624d}.secondary{background:none;color:var(--green-dark);font-weight:750}.demo-note{font-size:12px;color:var(--muted)}.progress{max-width:700px;margin:48px auto;text-align:center}.progress h2{font-size:29px;letter-spacing:-.04em;margin:0 0 8px}.progress p{color:var(--muted);margin:0 0 25px}.steps{display:grid;gap:9px;text-align:left}.step{display:flex;gap:12px;align-items:center;padding:12px 15px;border-radius:12px;background:#f5f8f4;color:#a0afaa;font-size:14px}.step.active{background:var(--green-soft);color:var(--green-dark);font-weight:750}.step.done{color:#466450}.step-dot{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;border:1px solid currentColor;font-size:11px}.result-shell{max-width:1080px;margin:22px auto 0}.material-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px 16px;color:var(--muted);font-size:13px}.material-bar strong{color:var(--ink);display:block}.result-card{margin-top:16px;background:rgba(255,255,252,.9);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:28px}..result-top{text-align:center;max-width:620px;margin:auto}.result-top h2{font-size:17px;color:var(--muted);font-weight:700;margin:0 0 15px}.claim{font-size:clamp(19px,2.5vw,27px);font-weight:750;letter-spacing:-.035em;margin:0 auto 21px;max-width:700px}.score{font-size:70px;line-height:1;color:var(--red);font-weight:850;letter-spacing:-.07em}.score-label{color:var(--red);font-weight:800;font-size:17px}.score-caption{font-weight:750;margin:12px 0 4px}.score-note{font-size:12px;color:var(--muted);margin:0 auto;max-width:480px}.evidence-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:30px 0}..evidence{border:1px solid var(--line);border-radius:17px;padding:17px;background:#fff}.evidence .e-icon{font-size:25px}.evidence h3{font-size:15px;margin:10px 0 8px}.pill{display:inline-block;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800}.pill.red{background:var(--red-soft);color:#b83e36}.pill.gold{background:var(--gold-soft);color:#956b17}.pill.green{background:var(--green-soft);color:var(--green-dark)}.evidence p{font-size:13px;color:var(--muted);margin:10px 0 0}.explanation{background:#f7faf6;border:1px solid #e2eae1;border-radius:17px;padding:20px;margin-bottom:25px}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.section-title h3{margin:0;font-size:17px}.section-title small{color:var(--muted)}.explanation p{margin:0;color:#435555;font-size:14px}.sources{border-top:1px solid var(--line);padding-top:21px}.source{display:grid;grid-template-columns:auto 1fr auto auto;gap:13px;align-items:center;padding:13px 0;border-bottom:1px solid #edf1ed}.source:last-child{border-bottom:0}.source-icon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--green-soft);color:var(--green-dark)}.source strong{display:block;font-size:13px}.source small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.source .open{background:none;color:var(--green-dark);font-size:18px}.recommend{display:flex;align-items:center;gap:14px;background:var(--gold-soft);border:1px solid #f0dfb8;border-radius:15px;padding:14px 17px;margin-top:18px}.recommend-icon{font-size:25px}.recommend strong{display:block}.recommend span{font-size:12px;color:#82672d}.result-actions{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:24px}.feedback{border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:20px;background:#fff}.feedback h3{margin:0 0 6px}.feedback p{margin:0 0 14px;color:var(--muted);font-size:13px}.feedback textarea{width:100%;min-height:90px;resize:vertical;border:1px solid #cbd8cc;border-radius:12px;padding:12px;outline:none}.feedback-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:999px;font-size:13px;box-shadow:0 12px 30px rgba(24,54,58,.22);z-index:9}.hidden{display:none!important}.empty-result{text-align:center;padding:42px 20px;max-width:620px;margin:auto}.empty-result .empty-icon{font-size:46px;color:var(--gold)}.empty-result h2{font-size:30px;letter-spacing:-.05em;margin:10px 0}.empty-result p{color:var(--muted);margin:0 auto 22px;max-width:510px}.scenario-bar{display:flex;gap:8px;justify-content:center;margin:16px auto 0;flex-wrap:wrap}.scenario{background:#eef4ee;color:var(--green-dark);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:750}.scenario.active{background:var(--green-dark);color:#fff}@media(max-width:760px){.app{padding:18px 15px 40px}.top-actions{gap:2px}.top-actions button{font-size:0}.top-actions button:first-child:before{content:"?";font-size:17px}.top-actions button:nth-child(2):before{content:"◷";font-size:20px}.top-actions button:nth-child(3):before{content:"◉";font-size:18px}.hero{margin:50px auto 15px}.hero p{font-size:15px}.hub{min-height:620px;margin-top:8px}.hub-lines{display:none}.hub-button{width:230px;height:230px;top:35%;}.hub-button strong{font-size:25px}.node{width:116px;height:116px}.node.sources{left:2%;top:5%}.node.history{right:2%;top:5%}.node.education{left:4%;bottom:9%}.node.image{right:4%;bottom:9%}.node.link{bottom:-1%;}.node .node-icon{font-size:25px}.node b{font-size:13px}.panel{padding:19px;border-radius:22px}.panel-actions,.result-actions{align-items:stretch;flex-direction:column}.primary{width:100%}.evidence-grid{grid-template-columns:1fr}.result-card{padding:20px;border-radius:22px}.material-bar{align-items:flex-start}.source{grid-template-columns:auto 1fr auto}.source .pill{grid-column:2}.source .open{grid-column:3;grid-row:1/3}.brand-name{font-size:18px}.brand-note{font-size:10px}.logo-small{display:none}}
  </style>
  <style>
    .result-top{text-align:center;max-width:620px;margin:auto}
    .evidence{border:1px solid var(--line);border-radius:17px;padding:17px;background:#fff}
  </style>
  <style>
    .blue-theme{--ink:#183a58;--muted:#6b7f91;--line:#d4e0e9;--paper:#f7fbff;--green:#4b8ab2;--green-dark:#1e668f;--green-soft:#e5f1f8;--gold:#d19a28;--gold-soft:#fbf4e1;--red:#cb5b58;--red-soft:#fae9e8;--shadow:0 24px 60px rgba(25,72,105,.12);background:radial-gradient(circle at 50% 7%,#fff 0,#f8fbfd 40%,#edf5fa 100%)}
    .blue-theme .shield{border-color:var(--green-dark);color:var(--green-dark)}
    .blue-theme .hub-button{background:linear-gradient(145deg,#6da6c5,#2f749c);box-shadow:0 0 0 2px #a9c8da,0 24px 48px rgba(35,104,145,.24)}
    .blue-theme .hub-lines i{background:#9fbfd2}.blue-theme .node{border-color:#b7cfdd}.blue-theme .primary{background:var(--green-dark)}
    .home-return{position:fixed;left:24px;bottom:22px;z-index:8;background:rgba(255,255,255,.92);border:1px solid var(--line);color:var(--green-dark);border-radius:999px;padding:10px 15px;font-weight:800;font-size:13px;box-shadow:0 10px 24px rgba(36,67,71,.12);transition:.2s}
    .home-return:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(36,67,71,.17)}
    .blue-theme .home-return{border-color:#b8d0df;box-shadow:0 10px 24px rgba(35,104,145,.13)}
    @media(max-width:760px){.home-return{left:15px;bottom:15px;padding:9px 13px}}
  </style>
  <style>
    .education-wrap{max-width:960px;margin:28px auto}.education-intro{background:linear-gradient(135deg,#f0f7f1,#fff);border:1px solid var(--line);border-radius:24px;padding:28px;display:flex;justify-content:space-between;gap:24px;align-items:center}.education-intro h2{margin:0 0 8px;font-size:28px;letter-spacing:-.04em}.education-intro p{margin:0;color:var(--muted);max-width:590px}.education-badge{font-size:46px;color:var(--green-dark);background:var(--green-soft);border-radius:50%;width:90px;height:90px;display:grid;place-items:center;flex:0 0 auto}.lesson-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}.lesson-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:0 12px 28px rgba(54,76,57,.06)}.lesson-card .lesson-icon{font-size:28px;color:var(--green-dark)}.lesson-card h3{font-size:16px;margin:11px 0 7px}.lesson-card p{font-size:13px;color:var(--muted);min-height:57px;margin:0 0 15px}.lesson-card button{border:0;background:var(--green-soft);color:var(--green-dark);border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer}.lesson-article{max-width:760px;margin:28px auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}.lesson-article h2{font-size:30px;letter-spacing:-.05em;margin:8px 0 14px}.lesson-article p{color:#435555}.lesson-article li{margin:9px 0;color:#435555}.lesson-back{border:0;background:none;color:var(--green-dark);font-weight:800;cursor:pointer;padding:0}.blue-theme .education-intro{background:linear-gradient(135deg,#edf7fc,#fff)}.blue-theme .education-badge{color:var(--green-dark);background:var(--green-soft)}.blue-theme .lesson-card button{background:var(--green-soft);color:var(--green-dark)}.blue-theme .lesson-back{color:var(--green-dark)}@media(max-width:760px){.education-intro{align-items:flex-start;flex-direction:column}.education-badge{width:66px;height:66px;font-size:34px}.lesson-grid{grid-template-columns:1fr}.lesson-card p{min-height:auto}}
  </style>
  <style>
    .node.education small{display:none}.module-shell{max-width:920px;margin:28px auto}.module-card{background:rgba(255,255,252,.9);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:26px}.module-card h2{margin:0;font-size:28px;letter-spacing:-.04em}.module-card>p{color:var(--muted);max-width:680px}.module-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}.module-item{border:1px solid var(--line);border-radius:17px;background:#fff;padding:18px}.module-item h3{margin:9px 0 5px;font-size:16px}.module-item p{margin:0;color:var(--muted);font-size:13px}.module-icon{font-size:28px;color:var(--green-dark)}.module-meta{font-size:11px;color:var(--muted);margin-top:12px;display:block}.module-toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.module-toolbar button{border:0;background:none;color:var(--green-dark);font-weight:800;cursor:pointer}.module-empty{border:1px dashed #bfd0c1;border-radius:16px;padding:24px;text-align:center;color:var(--muted);margin-top:18px}.module-empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:5px}@media(max-width:760px){.module-grid{grid-template-columns:1fr}.module-card{padding:20px}.module-toolbar{align-items:flex-start;flex-direction:column}}

<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><div class="shield">✓</div><div><div class="brand-name">DISINFO-Guard <span>AI</span></div><span class="brand-note">Analizuj. Weryfikuj. Działaj odpowiedzialnie.</span></div></div>
      <nav class="top-actions"><button data-action="help">Pomoc</button><button data-action="history">Historia</button><button data-action="account">Moje konto</button></nav>
    </header>
    <section id="app"></section>
  </main>
  <button id="homeReturn" class="home-return hidden" data-action="home">← Wróć do strony głównej</button>
  <div id="toast" class="toast hidden"></div>
  <script>
    const state={screen:'idle',mode:'low',link:'',upload:false,feedback:false,step:0};
    const app=document.querySelector('#app');
    const scenarios={low:{claim:'„Znana gwiazda muzyki POP była zaangażowana w aferę szpiegowską.”',score:18,label:'Dostępne dowody słabo potwierdzają to twierdzenie.',rec:'Wstrzymaj się z udostępnieniem'},high:{claim:'„Biblioteka miejska uruchomiła bezpłatne zajęcia cyfrowe dla seniorów.”',score:86,label:'Dostępne dowody silnie potwierdzają to twierdzenie.',rec:'Możesz sprawdzić szczegóły w źródłach'},empty:{claim:'„W najbliższy piątek wszystkie urzędy będą zamknięte.”',score:null,label:'Nie znaleziono wystarczających danych, aby ocenić twierdzenie.',rec:'Zachowaj ostrożność i sprawdź aktualne komunikaty'}};
    function header(title,sub){return `<div class="hero"><div class="eyebrow">DISINFO-Guard AI</div><h1>${title}</h1><p>${sub}</p></div>`}
    function idle(){app.innerHTML=header('Sprawdź, zanim uwierzysz.','Oceń siłę dowodów, zanim podasz informację dalej.')+`<section class="hub"><div class="hub-lines"><i></i><i></i><i></i><i></i><i></i></div><button class="hub-button" data-action="entry"><span class="mini-shield">♢</span><strong>Sprawdź swój<br/>materiał</strong><small>kliknij, aby zacząć</small></button><button class="node sources" data-action="coming"><span><span class="node-icon">⌕</span><b>Źródła</b></span></button><button class="node history" data-action="coming"><span><span class="node-icon">◷</span><b>Historia</b></span></button><button class="node education" data-action="coming"><span><span class="node-icon">⌂</span><b>Edukacja</b><small>wkrótce</small></span></button><button class="node image" data-action="entry"><span><span class="node-icon">▧</span><b>Zrzut ekranu</b></span></button><button class="node link" data-action="entry"><span><span class="node-icon">↗</span><b>Link</b></span></button></section><div class="demo">Prototyp demonstracyjny · dane są przykładowe <button data-action="demo">Zobacz przykład wyniku</button></div>`}
    function entry(){app.innerHTML=header('Sprawdź, zanim uwierzysz.','Dodaj materiał, a prototyp pokaże, jak może wyglądać analiza dowodów.')+`<section class="panel"><div class="panel-head"><div><h2>Sprawdź swój materiał</h2><p class="panel-sub">Wklej link lub dodaj zrzut ekranu z informacją, która budzi Twoje wątpliwości.</p></div><button class="close" data-action="home">×</button></div><label class="input-label" for="link">Link do posta lub artykułu</label><div class="input-wrap"><span>↗</span><input id="link" placeholder="https://..." value="${state.link}"/></div><button class="upload ${state.upload?'selected':''}" data-action="upload"><strong>${state.upload?'✓ Zrzut ekranu dodany':'▧ Dodaj zrzut ekranu'}</strong><small>${state.upload?'screen-example.png · gotowy do analizy':'Przeciągnij plik tutaj lub kliknij, aby wybrać'}</small></button><div class="panel-actions"><span class="demo-note">To jest symulacja — nie łączy się z API.</span><button class="primary" data-action="analyze">Sprawdź wiarygodność →</button></div></section><div class="scenario-bar"><button class="scenario ${state.mode==='low'?'active':''}" data-mode="low">Przykład: niski wynik</button><button class="scenario ${state.mode==='high'?'active':''}" data-mode="high">Przykład: wysoki wynik</button><button class="scenario ${state.mode==='empty'?'active':''}" data-mode="empty">Przykład: brak danych</button></div>`;}
    function analyzing(){app.innerHTML=header('Analizuję materiał…','Spokojnie — pokazujemy kolejne kroki, bez sztucznego paska postępu.')+`<section class="progress"><h2>Przygotowuję ocenę dowodów</h2><p>To demonstracja przykładowego przebiegu analizy.</p><div class="steps"><div class="step ${state.step>0?'done':''} ${state.step===0?'active':''}"><span class="step-dot">${state.step>0?'✓':'1'}</span>Odczytuję treść materiału</div><div class="step ${state.step>1?'done':''} ${state.step===1?'active':''}"><span class="step-dot">${state.step>1?'✓':'2'}</span>Rozpoznaję główne twierdzenie</div><div class="step ${state.step>2?'done':''} ${state.step===2?'active':''}"><span class="step-dot">${state.step>2?'✓':'3'}</span>Sprawdzam źródła i potwierdzenia</div><div class="step ${state.step>3?'done':''} ${state.step===3?'active':''}"><span class="step-dot">${state.step>3?'✓':'4'}</span>Przygotowuję ocenę wiarygodności</div></div></section>`}
    function sourceRows(){return `<div class="source"><div class="source-icon">⌂</div><div><strong>Centrum Informacji Publicznej</strong><small>Komunikat z 12 czerwca 2025 · oficjalny materiał</small></div><span class="pill red">podważa</span><button class="open" data-action="source">↗</button></div><div class="source"><div class="source-icon">▤</div><div><strong>Newsroom 24 — analiza sprawy</strong><small>Artykuł z 13 czerwca 2025 · niezależny kontekst</small></div><span class="pill gold">kontekst</span><button class="open" data-action="source">↗</button></div><div class="source"><div class="source-icon">◎</div><div><strong>Wpis na profilu @news_daily</strong><small>Pierwotna publikacja · brak weryfikacji autora</small></div><span class="pill green">źródło pierwotne</span><button class="open" data-action="source">↗</button></div>`}
    function result(){const d=scenarios[state.mode]; if(!d.score)return emptyResult();app.innerHTML=header('Wynik analizy','Zobacz, jakie dowody stoją za oceną i sprawdź źródła samodzielnie.')+`<section class="result-shell"><div class="material-bar"><div><span>Analizowany materiał</span><strong>${state.link||'example.com/post/12345'} · link demonstracyjny</strong></div><button class="secondary" data-action="entry">Zmień materiał</button></div><div class="result-card"><div class="result-top"><h2>Analizowane twierdzenie</h2><p class="claim">${d.claim}</p><div class="score">${d.score}%</div><div class="score-label">siły dostępnych dowodów</div><p class="score-caption">${d.label}</p><p class="score-note">Wynik nie jest matematycznym prawdopodobieństwem prawdy. Pokazuje siłę aktualnie dostępnych dowodów.</p></div><div class="evidence-grid"><article class="evidence"><span class="e-icon">⌂</span><h3>Oficjalne materiały</h3><span class="pill red">Niski poziom potwierdzenia</span><p>Brak zgodności z uznanymi stanowiskami i komunikatami instytucji.</p></article><article class="evidence"><span class="e-icon">♧</span><h3>Niezależne potwierdzenia</h3><span class="pill gold">Średni poziom potwierdzenia</span><p>Część publikacji powtarza informację, ale odwołuje się do tego samego wpisu.</p></article><article class="evidence"><span class="e-icon">▤</span><h3>Źródło pierwotne</h3><span class="pill red">Niski poziom wiarygodności</span><p>Źródło nie ma jasnego autora ani niezależnej recenzji.</p></article></div><div class="explanation"><div class="section-title"><h3>Dlaczego taki wynik?</h3><small>krótkie uzasadnienie</small></div><p>Nie znaleziono oficjalnych komunikatów ani niezależnych materiałów potwierdzających opisaną aferę. Inne konta powtarzają wiadomość, ale odwołują się do tego samego niezweryfikowanego wpisu.</p></div><div class="sources"><div class="section-title"><h3>Źródła wykorzystane w analizie</h3><small>3 przykładowe źródła</small></div>${sourceRows()}</div><div class="recommend"><span class="recommend-icon">⚖</span><div><strong>${d.rec}</strong><span>Brak potwierdzenia nie oznacza automatycznie fałszu — zachowaj kontrolę nad decyzją.</span></div></div><div class="result-actions"><button class="primary" data-action="again">Sprawdź kolejną informację</button><button class="secondary" data-action="feedback">Podziel się opinią →</button></div>${state.feedback?feedback():''}</div></section>`}
    function emptyResult(){const d=scenarios.empty;app.innerHTML=header('Wynik analizy','Czasem najbardziej rzetelną odpowiedzią jest przyznanie, że danych jest za mało.')+`<section class="result-shell"><div class="material-bar"><div><span>Analizowany materiał</span><strong>${state.link||'example.com/post/12345'} · link demonstracyjny</strong></div><button class="secondary" data-action="entry">Zmień materiał</button></div><div class="result-card"><div class="empty-result"><div class="empty-icon">◌</div><h2>Brak wystarczających danych</h2><p>Nie znaleziono wystarczających, niezależnych i wiarygodnych źródeł, aby potwierdzić lub podważyć to twierdzenie.</p><p class="claim">${d.claim}</p><button class="primary" data-action="again">Sprawdź kolejną informację</button></div><div class="result-actions"><span class="demo-note">Prototyp nie wydaje wyroku za użytkownika.</span><button class="secondary" data-action="feedback">Podziel się opinią →</button></div>${state.feedback?feedback():''}</div></section>`}
    function feedback(){return `<div class="feedback"><h3>Co sądzisz o tym wyniku?</h3><p>Twoja opinia pomoże nam poprawić sposób prezentowania dowodów.</p><textarea placeholder="Napisz kilka zdań…"></textarea><div class="feedback-actions"><span class="demo-note">Formularz demonstracyjny</span><button class="primary" data-action="send">Wyślij opinię</button></div></div>`}
    function render(){if(state.screen==='idle')idle();if(state.screen==='entry')entry();if(state.screen==='analyzing')analyzing();if(state.screen==='result')result();document.querySelector('#homeReturn').classList.toggle('hidden',state.screen==='idle');}
    function toast(msg){const t=document.querySelector('#toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)}
    document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a==='entry')state.screen='entry';if(a==='home'){state.screen='idle';state.feedback=false;state.step=0}if(a==='upload'){state.upload=!state.upload;toast(state.upload?'Dodano przykładowy zrzut ekranu':'Usunięto zrzut ekranu')}if(a==='analyze'){state.link=document.querySelector('#link')?.value||'';state.screen='analyzing';state.step=0;render();let i=0;const timer=setInterval(()=>{i++;state.step=i;render();if(i>=4){clearInterval(timer);setTimeout(()=>{state.screen='result';render()},500)}},650);return}if(a==='again'){state.screen='entry';state.feedback=false}if(a==='feedback'){state.feedback=true}if(a==='send'){toast('Dziękujemy za opinię — to tylko demonstracja.')}if(a==='demo'){state.mode='low';state.screen='result'}if(a==='source'){toast('Źródło demonstracyjne — w prototypie nie otwiera zewnętrznej strony.')}if(a==='coming'||a==='history'||a==='account'||a==='help'){toast(a==='help'?'Pomoc będzie dostępna w kolejnej wersji.':a==='history'?'Historia analiz — wkrótce.':'Ta funkcja jest oznaczona jako „wkrótce”.')}render()});
    document.addEventListener('input',e=>{if(e.target.id==='link')state.link=e.target.value});document.addEventListener('click',e=>{const mode=e.target.closest('[data-mode]')?.dataset.mode;if(mode){state.mode=mode;render()}});if(new URLSearchParams(location.search).get('theme')==='blue')document.body.classList.add('blue-theme');render();
  </script>
  <script>
    const originalRender = render;
    function educationView(){app.innerHTML=header('Ucz się rozpoznawać dezinformację.','Krótki przewodnik pomoże Ci spokojnie ocenić informację, zanim przekażesz ją dalej.')+`<section class="education-wrap"><div class="education-intro"><div><h2>Małe kroki, większa odporność</h2><p>Materiały edukacyjne w prototypie pokazują, na co zwracać uwagę: źródło, kontekst, niezależne potwierdzenia i język emocji.</p></div><div class="education-badge">✦</div></div><div class="lesson-grid"><article class="lesson-card"><span class="lesson-icon">⌕</span><h3>Zatrzymaj się na chwilę</h3><p>Silne emocje i sensacyjne nagłówki często mają skłonić do szybkiego udostępnienia.</p><button data-edu="article" data-title="Zatrzymaj się na chwilę">Zobacz materiał →</button></article><article class="lesson-card"><span class="lesson-icon">◎</span><h3>Sprawdź źródło</h3><p>Poszukaj autora, daty publikacji i pierwotnego miejsca, z którego pochodzi informacja.</p><button data-edu="article" data-title="Sprawdź źródło">Zobacz materiał →</button></article><article class="lesson-card"><span class="lesson-icon">♧</span><h3>Szukaj niezależnego potwierdzenia</h3><p>Trzy artykuły mogą powtarzać jeden wpis. Liczy się niezależność, nie sama liczba publikacji.</p><button data-edu="article" data-title="Szukaj niezależnego potwierdzenia">Zobacz materiał →</button></article></div></section>`}
    function educationArticle(title){app.innerHTML=header('Materiał edukacyjny','Przykładowa karta do wykorzystania podczas pierwszych testów koncepcji.')+`<article class="lesson-article"><button class="lesson-back" data-edu="back">← Wróć do edukacji</button><h2>${title||'Zatrzymaj się na chwilę'}</h2><p>Zanim uznasz informację za prawdziwą, daj sobie moment na sprawdzenie. Nie chodzi o to, aby od razu wydać wyrok, ale aby nazwać twierdzenie i zobaczyć, jakie dowody są dostępne.</p><ol><li>Oddziel twierdzenie od opinii i emocjonalnego komentarza.</li><li>Sprawdź, kto opublikował materiał jako pierwszy.</li><li>Poszukaj niezależnych źródeł, które nie kopiują tej samej treści.</li><li>Zwróć uwagę, czy brak potwierdzenia wynika z nowości wydarzenia.</li></ol><div class="recommend"><span class="recommend-icon">⚖</span><div><strong>Najważniejsza zasada</strong><span>Brak dowodów nie oznacza automatycznie fałszu. Zachowaj kontrolę nad decyzją.</span></div></div></article>`}
    function decorateScenario(){if(state.screen!=='result'||state.mode==='low')return;const high=state.mode==='high';const root=document.querySelector('.result-card');if(!root)return;const label=root.querySelector('.score-caption');if(label)label.textContent=high?'Dostępne dowody silnie potwierdzają to twierdzenie.':'Dostępne dowody wskazują na mieszany obraz.';const pills=root.querySelectorAll('.evidence .pill');if(pills.length){pills[0].textContent=high?'Wysoki poziom potwierdzenia':'Średni poziom potwierdzenia';pills[0].className='pill '+(high?'green':'gold');pills[1].textContent=high?'Wysoki poziom potwierdzenia':'Średni poziom potwierdzenia';pills[1].className='pill '+(high?'green':'gold');pills[2].textContent=high?'Dobra wiarygodność':'Średni poziom wiarygodności';pills[2].className='pill '+(high?'green':'gold')}const why=root.querySelector('.explanation p');if(why)why.textContent=high?'Twierdzenie znajduje potwierdzenie w oficjalnym komunikacie oraz w kilku niezależnych materiałach. Źródło pierwotne jest jasno opisane i prowadzi do dokumentu instytucji.':'Część dostępnych materiałów potwierdza twierdzenie, ale źródła różnią się jakością i zakresem informacji.';const rec=root.querySelector('.recommend strong');if(rec)rec.textContent=high?'Możesz sprawdzić szczegóły w źródłach':'Zachowaj ostrożność i sprawdź kontekst'}
    render=function(){if(state.screen==='education')educationView();else if(state.screen==='educationArticle')educationArticle(state.educationTitle);else originalRender();if(typeof decorateScenario==='function')decorateScenario()};
    document.addEventListener('click',e=>{const education=e.target.closest('.education');if(education){e.preventDefault();e.stopImmediatePropagation();state.screen='education';render()}},true);
    document.addEventListener('click',e=>{const action=e.target.closest('[data-edu]')?.dataset.edu;if(!action)return;e.preventDefault();e.stopImmediatePropagation();if(action==='article'){state.educationTitle=e.target.dataset.title;state.screen='educationArticle'}if(action==='back')state.screen='education';render()},true);
    document.addEventListener('click',e=>{if(e.target.closest('[data-action="analyze"]')){const pool=['low','high','empty'];state.mode=pool[Math.floor(Math.random()*pool.length)]}},true);
  </script>
  <script>
    const renderWithEducation = render;
    function resourceView(kind){const views={link:{title:'Sprawdź informację z linku',intro:'Wklej adres artykułu lub posta. Prototyp rozpozna materiał i przeprowadzi przykładową analizę.',icon:'↗',items:[['1','Wklej adres','https://example.com/post/12345'],['2','Rozpoznaj twierdzenie','Aplikacja wyodrębni główną tezę z materiału.'],['3','Zobacz dowody','Otrzymasz wynik, uzasadnienie i listę źródeł.']]},image:{title:'Sprawdź zrzut ekranu',intro:'Dodaj obraz wiadomości, posta lub artykułu. W tej wersji używamy przykładowego pliku demonstracyjnego.',icon:'▧',items:[['1','Dodaj obraz','screen-example.png'],['2','Odczytaj kontekst','W przyszłości moduł pomoże odczytać tekst i źródło.'],['3','Porównaj dowody','Wynik pokaże, co potwierdza lub podważa twierdzenie.']]},history:{title:'Twoje wcześniejsze sprawdzenia',intro:'Historia jest jeszcze demonstracyjna — pokazuje, jak może wyglądać powrót do poprzednich analiz.',icon:'◷',items:[['18%','Afera szpiegowska gwiazdy POP','wynik demonstracyjny · 2 min temu'],['86%','Zajęcia cyfrowe dla seniorów','wynik demonstracyjny · wczoraj'],['—','Zamknięte urzędy w piątek','brak wystarczających danych · 3 dni temu']]},sources:{title:'Źródła i role dowodów',intro:'Tu użytkownik może zrozumieć, skąd bierze się wynik i jaką rolę pełni każde źródło.',icon:'⌕',items:[['Oficjalne','Komunikaty instytucji','potwierdza lub podważa twierdzenie'],['Niezależne','Materiały różnych redakcji','dostarcza niezależnego kontekstu'],['Pierwotne','Pierwsza publikacja','pomaga ocenić autora i pochodzenie informacji']]}}[kind]||null;if(!views)return;app.innerHTML=header(views.title,'Prosty moduł demonstracyjny wspierający główną ścieżkę sprawdzania informacji.')+`<section class="module-shell"><div class="module-card"><div class="module-toolbar"><span class="module-icon">${views.icon}</span><button data-action="home">← Wróć do strony głównej</button></div><h2>${views.title}</h2><p>${views.intro}</p><div class="module-grid">${views.items.map(item=>`<article class="module-item"><span class="pill ${kind==='history'?'red':'green'}">${item[0]}</span><h3>${item[1]}</h3><p>${item[2]}</p>${kind==='history'?'<span class="module-meta">Otwórz analizę demonstracyjną →</span>':''}</article>`).join('')}</div>${kind==='link'||kind==='image'?'<div style="margin-top:20px"><button class="primary" data-action="entry">Przejdź do sprawdzania materiału →</button></div>':''}${kind==='sources'?'<div class="module-empty"><strong>Źródła są częścią każdej analizy</strong>Otwórz przykładowy wynik, aby zobaczyć ich role przy konkretnym twierdzeniu.</div>':''}</div></section>`}
    render=function(){if(state.screen==='resource')resourceView(state.resource);else renderWithEducation();document.querySelector('#homeReturn').classList.toggle('hidden',state.screen==='idle')};
    document.addEventListener('click',e=>{const target=e.target.closest('.history,.sources,.image,.link,[data-action="history"]');if(!target)return;e.preventDefault();e.stopImmediatePropagation();const cls=target.classList;state.resource=cls.contains('history')||target.dataset.action==='history'?'history':cls.contains('sources')?'sources':cls.contains('image')?'image':'link';state.screen='resource';render()},true);
  </script>
</body>
</html>
